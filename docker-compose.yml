name: DevCollab CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:

  ############################################
  # CI
  ############################################
  ci:
    name: Build & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      ########################################
      # Backend
      ########################################

      - name: Install Backend Dependencies
        working-directory: Backend
        run: npm install

      - name: Check Backend Syntax
        working-directory: Backend
        run: node --check server.js

      ########################################
      # Frontend
      ########################################

      - name: Install Frontend Dependencies
        working-directory: Frontend
        run: npm install

      - name: Build Frontend
        working-directory: Frontend
        env:
          VITE_BASE_URL: /api
          VITE_SOCKET_URL: /
        run: npm run build

  ############################################
  # CD
  ############################################

  deploy:
    name: Deploy to EC2
    needs: ci

    if: github.event_name != 'pull_request'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT }}
          timeout: 120s
          command_timeout: 15m

          script: |
            set -e

            APP_DIR="$HOME/DevCollab"
            BRANCH="${{ github.ref_name }}"

            echo "Deploying branch: $BRANCH"

            if [ ! -d "$APP_DIR" ]; then
              git clone https://github.com/${{ github.repository }}.git "$APP_DIR"
              cd "$APP_DIR"
            else
              cd "$APP_DIR"
              git fetch origin "$BRANCH"
              git checkout "$BRANCH"
              git reset --hard origin/"$BRANCH"
            fi

            echo "Creating .env"

            cat > .env <<EOF
            PORT=5000
            NODE_ENV=production
            MONGO_URI=${{ secrets.MONGO_URI }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_EXPIRES_IN=${{ secrets.JWT_EXPIRES_IN }}
            CLIENT_URL=${{ secrets.CLIENT_URL }}
            VITE_BASE_URL=/api
            VITE_SOCKET_URL=/
            GRAFANA_ADMIN_USER=${{ secrets.GRAFANA_ADMIN_USER }}
            GRAFANA_ADMIN_PASSWORD=${{ secrets.GRAFANA_ADMIN_PASSWORD }}
            EOF

            cp .env Backend/.env

            if ! command -v docker >/dev/null 2>&1; then
              echo "Docker not found."
              chmod +x scripts/setup-ec2.sh
              ./scripts/setup-ec2.sh
            fi

            docker compose down || true

            docker compose up -d --build --remove-orphans

            docker image prune -f

            echo "Waiting for application..."

            HEALTHY=false

            for i in {1..15}; do

              if curl -fs http://localhost:5000/api/health >/dev/null || \
                 curl -fs http://localhost/api/health >/dev/null; then
                HEALTHY=true
                break
              fi

              echo "Attempt $i/15"

              sleep 5

            done

            if [ "$HEALTHY" = true ]; then
              echo "Deployment Successful!"
            else
              echo "Health check failed."

              docker compose ps
              docker compose logs --tail=50

              exit 1
            fi