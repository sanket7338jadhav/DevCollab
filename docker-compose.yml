services:
  # ============================================================================
  # 1. MongoDB Database
  # ============================================================================
  mongodb:
    image: mongo:7
    container_name: devcollab-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=devcollab
    volumes:
      - mongo_data:/data/db
    networks:
      - devcollab-net

  # ============================================================================
  # 2. DevCollab Express API & WebSocket Server
  # ============================================================================
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    image: devcollab-backend
    container_name: devcollab-backend
    restart: unless-stopped
    depends_on:
      - mongodb
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=${MONGO_URI:-mongodb://mongodb:27017/devcollab}
      - JWT_SECRET=${JWT_SECRET:-devcollab_super_secret_jwt_key_2026}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - CLIENT_URL=${CLIENT_URL:-http://localhost}
    networks:
      - devcollab-net

  # ============================================================================
  # 3. DevCollab React SPA (Nginx Reverse Proxy)
  # ============================================================================
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        - VITE_BASE_URL=${VITE_BASE_URL:-/api}
        - VITE_SOCKET_URL=${VITE_SOCKET_URL:-/}
    image: devcollab-frontend
    container_name: devcollab-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - devcollab-net

  # ============================================================================
  # 4. Prometheus Monitoring Engine
  # ============================================================================
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: devcollab-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
    depends_on:
      - backend
    networks:
      - devcollab-net

  # ============================================================================
  # 5. Grafana Observability & SRE Dashboards
  # ============================================================================
  grafana:
    image: grafana/grafana:10.4.0
    container_name: devcollab-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/dashboards/devcollab-sre.json
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - devcollab-net

volumes:
  mongo_data:
  prometheus_data:
  grafana_data:

networks:
  devcollab-net:
    driver: bridge